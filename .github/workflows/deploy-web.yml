name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      # --pwa-strategy=none skips generating the offline-first service worker:
      # with it, browsers keep serving a cached build (bundled templates
      # included) until every tab is closed and reopened, not just refreshed.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --pwa-strategy=none

      # Visitors from before this change have the old offline-first service
      # worker already installed; a missing/changed flutter_service_worker.js
      # isn't enough to make it let go of its own cache. Publish a
      # self-destructing worker at that same URL so the browser's routine
      # update check picks it up, clears every cache, and unregisters --
      # after which the site is served fresh, same as everyone else.
      - name: Publish a self-unregistering service worker
        run: |
          cat > build/web/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
                .then(() => self.registration.unregister())
                .then(() => self.clients.matchAll())
                .then((clients) => clients.forEach((client) => client.navigate(client.url)))
            );
          });
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
