name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "assets/templates/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BoxDesign-portable-${{ steps.version.outputs.version }}.zip

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} windows\installer\box_design.iss

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxDesign-portable
          path: BoxDesign-portable-*.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxDesign-installer
          path: windows/installer/Output/*.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BoxDesign-portable-*.zip
            windows/installer/Output/*.exe

      # Keeps a single "rolling" pre-release always pointing at the newest
      # successful build from a plain push to main, so there's always
      # somewhere to grab the latest exe without cutting a version release.
      # Tag pushes are excluded -- those go to their own versioned release
      # only. Moving the tag ourselves (rather than relying on the release
      # action to do it) guarantees it always lands on this build's commit,
      # even though the tag already exists.
      - name: Move rolling tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f rolling
          git push origin rolling --force

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling build
          prerelease: true
          body: |
            Automatically updated on every successful build from `main`. Not a stable release -- see the versioned releases for that.

            Built from commit ${{ github.sha }}.
          files: |
            BoxDesign-portable-*.zip
            windows/installer/Output/*.exe
